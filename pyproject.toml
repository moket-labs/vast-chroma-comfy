[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vast-chroma-comfy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
